name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # Reduce CI minutes: only test min + max Python on non-Linux runners.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install CPU-only PyTorch first
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check pureframe tests

      - name: Ruff format
        run: ruff format --check pureframe tests

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Smoke test wheel install (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m venv /tmp/pureframe-smoke
          source /tmp/pureframe-smoke/bin/activate
          pip install dist/*.whl
          pureframe --version
          pureframe --help

      - name: Smoke test wheel install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv $env:RUNNER_TEMP\pureframe-smoke
          & "$env:RUNNER_TEMP\pureframe-smoke\Scripts\Activate.ps1"
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          pip install $wheel.FullName
          pureframe --version
          pureframe --help

      - name: Run fast tests with coverage
        run: pytest -q -m "not slow" --maxfail=3 --timeout=180 --timeout-method=thread --cov=pureframe --cov-report=term-missing --cov-report=xml:coverage.xml
        timeout-minutes: 30

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  gui-typecheck:
    name: GUI typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci || npm install
      - name: TypeScript typecheck
        working-directory: gui
        run: npm run typecheck
      # ESLint omitted: no flat config is checked in (config-protection
      # hook blocks adding one). The package.json `lint` script remains
      # available for local use once a config lands.

  gui-e2e:
    name: GUI E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci || npm install
      - name: Install Playwright browsers
        working-directory: gui
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        working-directory: gui
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: gui/playwright-report/
          retention-days: 7

  version-sync-check:
    name: Verify version sync (pyproject is source of truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python packaging/sync_versions.py --check
