name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: test (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install CPU-only PyTorch first
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check pureframe tests

      - name: Ruff format
        run: ruff format --check pureframe tests

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Smoke test wheel install
        run: |
          python -m venv /tmp/pureframe-smoke
          source /tmp/pureframe-smoke/bin/activate
          pip install dist/*.whl
          pureframe --version
          pureframe --help

      - name: Run fast tests with coverage
        run: pytest -q -m "not slow" --maxfail=3 --cov=pureframe --cov-report=term-missing --cov-report=xml:coverage.xml
        timeout-minutes: 10

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
