name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  version-guard:
    name: Verify version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check versions across pyproject / package.json / tauri.conf / Cargo.toml
        run: python packaging/sync_versions.py --check

  tauri-build:
    needs: version-guard
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - name: Install Frontend Dependencies
      working-directory: gui
      run: npm install
    - name: Build Tauri App
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # macOS code signing + notarization + Tauri updater signing - all
        # optional. tauri-action silently skips signing/notarization when the
        # corresponding env vars are absent, so we deliberately do not export
        # empty strings here (empty APPLE_CERTIFICATE makes `security import`
        # fail the build). To enable: add the secrets to the repo, then
        # re-export them here.
      with:
        projectPath: gui
        tagName: ${{ github.ref_name }}
        releaseName: 'PureFrame ${{ github.ref_name }}'
        releaseBody: 'Release ${{ github.ref_name }}'
        releaseDraft: false
        # Tag pipelines exercising a release candidate (v0.2.3-rc1) must not
        # advertise themselves as stable releases on GitHub.
        prerelease: ${{ contains(github.ref_name, 'rc') }}
        args: ${{ matrix.os == 'macos-latest' && format('--target {0}', matrix.target) || '' }}

  pyinstaller-build:
    name: PyInstaller (${{ matrix.os }})
    needs: version-guard
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: pureframe-windows-x86_64.zip
            archive-cmd: powershell -Command "Compress-Archive -Path dist/pureframe -DestinationPath pureframe-windows-x86_64.zip"
            asset-path: pureframe-windows-x86_64.zip
          - os: macos-latest
            artifact-name: pureframe-macos-arm64.tar.gz
            archive-cmd: tar -czf pureframe-macos-arm64.tar.gz -C dist pureframe
            asset-path: pureframe-macos-arm64.tar.gz
          # Intel mac (x86_64) PyInstaller dropped: GH-hosted macos-13 runners
          # severely backlogged (jobs queue 6+ hours). Intel mac users: use
          # `pip install pureframe` or the Tauri x64 .dmg installer.
          - os: ubuntu-latest
            artifact-name: pureframe-linux-x86_64.tar.gz
            archive-cmd: tar -czf pureframe-linux-x86_64.tar.gz -C dist pureframe
            asset-path: pureframe-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install ffmpeg (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install ffmpeg (macOS)
      if: runner.os == 'macOS'
      run: brew install ffmpeg

    - name: Install ffmpeg (Windows)
      if: runner.os == 'Windows'
      run: choco install ffmpeg -y --no-progress

    - name: Install CPU-only PyTorch
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Install PureFrame + PyInstaller
      shell: bash
      run: |
        pip install -e .
        pip install pyinstaller

    - name: Build standalone executable
      shell: bash
      env:
        PYTHONIOENCODING: utf-8
        PYTHONUTF8: "1"
      run: python packaging/build_desktop.py

    - name: Smoke test executable (Unix)
      if: runner.os != 'Windows'
      run: ./dist/pureframe/pureframe --version

    - name: Smoke test executable (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: .\dist\pureframe\pureframe.exe --version

    - name: Bundle ffmpeg into Windows zip
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $url = "https://github.com/GyanD/codexffmpeg/releases/download/2024-12-19-git-494c961379/ffmpeg-2024-12-19-git-494c961379-essentials_build.zip"
        $tmp = "$env:RUNNER_TEMP\ffmpeg.zip"
        Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
        Expand-Archive -Path $tmp -DestinationPath "$env:RUNNER_TEMP\ffmpeg_extracted" -Force
        $bin = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Copy-Item $bin.FullName -Destination "dist\pureframe\ffmpeg.exe"
        $probe = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
        Copy-Item $probe.FullName -Destination "dist\pureframe\ffprobe.exe"
        Write-Host "Bundled ffmpeg.exe and ffprobe.exe into dist\pureframe\"

    # Static ffmpeg + ffprobe next to the binary, matching the Windows zip.
    # The CLI prepends its exe dir to PATH when frozen, so a co-bundled
    # ffmpeg is found without a system install. Pinned sources, both
    # verified for the runner architecture:
    #   macOS arm64: ffmpeg-static b6.1.1 (darwin-arm64) + the
    #     @ffprobe-installer darwin-arm64 npm tarball (static Mach-O)
    #   Linux x64: johnvansickle 7.0.2 amd64 static (ffmpeg + ffprobe)
    - name: Bundle ffmpeg into macOS tarball
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP/ffmpeg-bundle"
        mkdir -p "$tmp"
        curl -sSL --fail -o "$tmp/ffmpeg.gz" \
          "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz"
        curl -sSL --fail -o "$tmp/ffprobe.tgz" \
          "https://registry.npmjs.org/@ffprobe-installer/darwin-arm64/-/darwin-arm64-5.0.1.tgz"
        gunzip -c "$tmp/ffmpeg.gz" > dist/pureframe/ffmpeg
        tar -xzf "$tmp/ffprobe.tgz" -C "$tmp"
        cp "$tmp/package/ffprobe" dist/pureframe/ffprobe
        chmod +x dist/pureframe/ffmpeg dist/pureframe/ffprobe

    - name: Bundle ffmpeg into Linux tarball
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP/ffmpeg-bundle"
        mkdir -p "$tmp"
        curl -sSL --fail -o "$tmp/ffmpeg.tar.xz" \
          "https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz"
        tar -xJf "$tmp/ffmpeg.tar.xz" -C "$tmp"
        cp "$tmp/ffmpeg-7.0.2-amd64-static/ffmpeg" dist/pureframe/ffmpeg
        cp "$tmp/ffmpeg-7.0.2-amd64-static/ffprobe" dist/pureframe/ffprobe
        chmod +x dist/pureframe/ffmpeg dist/pureframe/ffprobe

    # The bundling steps above must fail the job if a binary is missing or
    # not runnable on the runner's own architecture - the archive step
    # below then ships a proven-working pair.
    - name: Verify bundled ffmpeg/ffprobe (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        ./dist/pureframe/ffmpeg -version | head -n1
        ./dist/pureframe/ffprobe -version | head -n1

    - name: Archive build
      shell: bash
      run: ${{ matrix.archive-cmd }}

    - name: Upload artifact to release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: ${{ matrix.asset-path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Generate SHA-256 sums
    needs: [tauri-build, pyinstaller-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          cd assets
          # Pull every asset attached to the tag by tauri-action / softprops.
          # Exclude any preexisting SHA256SUMS.txt so we don't checksum it
          # against itself on re-runs.
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            --pattern '*' \
            --skip-existing
          rm -f SHA256SUMS.txt SHA256SUMS.txt.sig

      - name: Compute SHA-256 sums
        run: |
          cd assets
          sha256sum -- * | sort -k 2 > ../SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat ../SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
