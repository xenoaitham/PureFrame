name: Nightly slow suite

# The regular CI runs `-m "not slow"` — which is exactly how the v0.2.0
# render bugs shipped: the real-render e2e guards existed, were failing on
# master, and nothing noticed because the slow marker kept them out of CI.
# This scheduled job runs the full slow suite (real renders plus the
# model-download classifier tests) once a night so drift gets caught within
# a day instead of at the next local run.
#
# One OS and one Python keep the cost bounded; the fast suite already
# covers the 3.11–3.13 × 3-OS matrix, and slow tests are about render and
# model behavior, not interpreter surface.

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  slow-suite:
    name: slow tests (ubuntu, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install CPU-only PyTorch first
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run the slow suite
        # CUDA hidden so the guards exercise the CPU path CI actually ships.
        run: CUDA_VISIBLE_DEVICES="" pytest -q -m "slow" --timeout=900 --timeout-method=thread
        timeout-minutes: 45
