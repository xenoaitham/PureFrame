[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pureframe"
version = "0.1.0b11"
description = "Local AI tool that applies smooth, localized blur over explicit visuals in movies and TV files. No scene cutting, no audio changes."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "PureFrame Contributors"}]
keywords = ["video", "filter", "family-friendly", "computer-vision", "censoring", "smart-blur", "ai", "privacy", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "opencv-python-headless>=4.8.0",
    "scenedetect>=0.6.4",
    "nudenet>=3.4.2",
    "onnxruntime>=1.15.0",
    "torch>=2.4.0",
    "pydantic>=2.0",
    "pydantic-settings",
    "typer",
    "rich",
    "tqdm",
    "numpy>=1.24.0",
    "transformers>=4.30.0",
    "panns-inference>=0.1.1",
    "librosa>=0.10.0",
    "platformdirs>=4.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "build",
    "twine",
]

[project.scripts]
pureframe = "pureframe.cli:app"

[project.urls]
Homepage = "https://github.com/xenoaitham/PureFrame"
Documentation = "https://github.com/xenoaitham/PureFrame/tree/master/docs"
Issues = "https://github.com/xenoaitham/PureFrame/issues"
Source = "https://github.com/xenoaitham/PureFrame"

[tool.hatch.build.targets.wheel]
packages = ["pureframe"]


