[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pureframe"
version = "0.2.1"
description = "Local AI tool that applies smooth, localized blur over explicit visuals in movies and TV files. No scene cutting, no audio changes."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "PureFrame Contributors"}]
keywords = ["video", "filter", "family-friendly", "computer-vision", "censoring", "smart-blur", "ai", "privacy", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2.0",
    # Both opencv flavors ship the `cv2` namespace: if either resolves to
    # 5.x it clobbers the other at import time, and 5.x dropped the Caffe
    # dnn importer the face detector relies on. Constrain them together.
    "opencv-python-headless>=4.8.0,<5.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "scenedetect>=0.6.4",
    "nudenet>=3.4.2",
    "onnxruntime>=1.15.0",
    "onnx>=1.15.0",
    "torch>=2.4.0",
    "pydantic>=2.0",
    "pydantic-settings",
    "typer",
    "rich",
    "tqdm",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "transformers>=4.30.0",
    "panns-inference>=0.1.1",
    "librosa>=0.10.0",
    "platformdirs>=4.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "build",
    "twine",
]

[project.scripts]
pureframe = "pureframe.cli:app"

[project.urls]
Homepage = "https://github.com/xenoaitham/PureFrame"
Documentation = "https://github.com/xenoaitham/PureFrame/tree/master/docs"
Issues = "https://github.com/xenoaitham/PureFrame/issues"
Source = "https://github.com/xenoaitham/PureFrame"

[tool.hatch.build.targets.wheel]
packages = ["pureframe"]


[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit selection so a ruff release changing its default rule set can
# never silently redefine "passing" in CI (this repo went red exactly that
# way in July 2026). Extend deliberately, not by upgrade accident.
select = [
    "E4",  # pycodestyle errors
    "E7",  # pycodestyle (statement-level)
    "E9",  # pycodestyle (runtime-level)
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade (3.11+ idioms)
]
ignore = [
    # (str, Enum) -> StrEnum changes str() semantics of members (repr-style
    # output becomes raw values). The enums here are serialized into censor
    # plans and logs; keep the classic mixin form deliberately.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["pureframe"]


