[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pureframe"
version = "0.1.0"
description = "Watch movies and TV episodes with localized explicit visual censorship."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "PureFrame Contributors"}]
keywords = ["video", "censorship", "family", "filter", "yolo", "ai", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python",
    "opencv-python-headless",
    "scenedetect>=0.6.4",
    "nudenet>=3.4.2",
    "onnxruntime",
    "torch>=2.4",
    "pydantic>=2.0",
    "pydantic-settings",
    "typer",
    "rich",
    "tqdm",
    "numpy",
    "transformers",
    "panns-inference",
    "librosa",
    "platformdirs>=4.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
    "build",
]

[project.scripts]
pureframe = "pureframe.cli:app"

[project.urls]
Homepage = "https://github.com/PureFrame/pureframe"
Documentation = "https://github.com/PureFrame/pureframe/tree/main/docs"
Issues = "https://github.com/PureFrame/pureframe/issues"

[tool.hatch.build.targets.wheel]
packages = ["pureframe"]
