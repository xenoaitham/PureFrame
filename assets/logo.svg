<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PureFrame mark: a soft disc dissolving into a crisp one, cut by one
       horizon line. Blurred versus sharp - the whole idea in one glyph. -->
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#0d1117"/>
  <circle cx="120" cy="256" r="118" fill="#3898e0" filter="url(#soft)"/>
  <line x1="110" y1="256" x2="426" y2="256" stroke="#e6edf3" stroke-width="14"/>
  <circle cx="318" cy="256" r="111" fill="none" stroke="#e6edf3" stroke-width="14"/>
</svg>
