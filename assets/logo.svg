<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#8ab4f8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8ab4f8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8ab4f8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-inner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame-clip">
      <rect x="112" y="148" width="288" height="216" rx="6" ry="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0a0c14"/>

  <!-- Soft glow behind frame -->
  <ellipse cx="256" cy="256" rx="180" ry="135" fill="url(#glow)" filter="url(#blur-inner)"/>

  <!-- Main frame border -->
  <rect x="112" y="148" width="288" height="216" rx="6" ry="6"
        fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.95"/>

  <!-- Inner blur zone - right half of frame -->
  <g clip-path="url(#frame-clip)">
    <!-- Clear left half: subtle grid lines to imply "sharp" content -->
    <rect x="112" y="148" width="144" height="216" fill="#1a1f2e" opacity="0.6"/>
    <line x1="150" y1="148" x2="150" y2="364" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    <line x1="188" y1="148" x2="188" y2="364" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    <line x1="226" y1="148" x2="226" y2="364" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    <line x1="112" y1="185" x2="400" y2="185" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    <line x1="112" y1="220" x2="400" y2="220" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    <line x1="112" y1="256" x2="400" y2="256" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    <line x1="112" y1="292" x2="400" y2="292" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    <line x1="112" y1="327" x2="400" y2="327" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>

    <!-- Blur right half: blue blurred ellipse -->
    <ellipse cx="330" cy="256" rx="80" ry="65" fill="#8ab4f8" filter="url(#blur-inner)" opacity="0.55"/>

    <!-- Transition gradient overlay left→right -->
    <rect x="112" y="148" width="288" height="216" fill="url(#transition-grad)"/>
  </g>

  <defs>
    <linearGradient id="transition-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a0c14" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#0a0c14" stop-opacity="0"/>
      <stop offset="58%"  stop-color="#0a0c14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0c14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Corner brackets -->
  <!-- Top-left -->
  <polyline points="90,126 90,152 116,152" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="square" opacity="0.85"/>
  <!-- Top-right -->
  <polyline points="422,126 422,152 396,152" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="square" opacity="0.85"/>
  <!-- Bottom-left -->
  <polyline points="90,386 90,360 116,360" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="square" opacity="0.85"/>
  <!-- Bottom-right -->
  <polyline points="422,386 422,360 396,360" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="square" opacity="0.85"/>

  <!-- Centre dot - the "target" blur point -->
  <circle cx="320" cy="256" r="4" fill="#8ab4f8" opacity="0.7"/>
  <circle cx="320" cy="256" r="10" fill="none" stroke="#8ab4f8" stroke-width="1" opacity="0.35"/>
</svg>
